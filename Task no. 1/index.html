<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Slicker Website</title>

    <!-- fontawesome stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- stylesheet for slick theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/2.0.0/slick-theme.min.css" rel="stylesheet" integrity="sha384-AThqinpDJV+SIEXgrpYi7a1G4RW2f74fmZOkxZtmvakPPAcHGW2rEjfg/QjUyGS+" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/2.0.0/slick.min.css" rel="stylesheet" integrity="sha384-KohQL6YBiGZciD/ndkn1Ko7o85BrIrBAmRBqWXsv1SaRtrdBKnGEJxuQslkmwBBA" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- outer stylesheet initialization-->
    <!-- I usually prefer using scss and generate css, but it's your choice :)
    extension for vscode: glenn2223.live-sass -->
    <link rel="stylesheet" href="./assets/css/app.css" />
  </head>
  <body>
    <div class="contents">
      <div class="overlay-content">
        <img src="assets/img/TriBali_Logo_Web.svg" alt="Logo" class="logo" />
        <div class="text-content">
          <h3>COMING SOON</h3>
          <p><span>
            In the meantime follow us on<br> Instagram,
             or find us at the market <br>
             (Bondi and Paddington)</span>
             <br>
             <span>Sign up to find out when we launch!</span>
          </p>
        </div>
        <div class="subscribe-follow">
          <box-icon name="instagram" type="logo" color="#a89d83"></box-icon>
          <div class="subscribe-container">
            <input
              type="email"
              placeholder="Subscribe your email"
              class="subscribe-input"
            />
           
            <box-icon type="solid" name="right-arrow" color="#a89d83"></box-icon>
          </div>
        </div>
        
      </div>
      <!-- Slick slider wrapper -->
      <div class="slick-wrapper">
        <div class="slick-slide">
          <img src="assets/img/Tribali_website_comingsoon1.png" 
          data-mobile-src="assets/img/Tribali_website_smallwebsite1.png"
          alt="Slide 1" />
          
        </div>
        <div class="slick-slide">
          <img src="assets/img/Tribali_website_comingsoon2.png" 
          data-mobile-src="assets/img/Tribali_website_smallwebsite2.png"
          alt="Slide 2" />
          
        </div>
        <div class="slick-slide">
          <img src="assets/img/Tribali_website_comingsoon3.png"
          data-mobile-src="assets/img/Tribali_website_smallwebsite3.png"
          alt="Slide 3" />
          
        </div>
      </div>
    </div>
    

    <!-- boxicons web component (instagram / arrow icons) -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js" integrity="sha384-7mJOKdhjyvl9nulnWfxlDA9QTOGfRSIpUaFwjS79e4/QOPuafmAzqmYnsT+QEsu1" crossorigin="anonymous"></script>

    <!-- jQuery 4 + slick-carousel 2 -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/2.0.0/slick.min.js" integrity="sha384-5MfYQxWDQgt6TThAM9tk3dZqJNosm/eVLxtQLosoyTz8eFus3yIUO7luxPHqSqpU" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="script.js"></script>
  </body>
</html>
