<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Tribali</title>
  <meta name="description" content="Sign in to your Tribali account. Demo login form with validation, show password and remember me.">
  <meta name="theme-color" content="#121110">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sign in - Tribali">
  <meta property="og:description" content="Demo login form with full validation, show password and remember me.">
  <meta property="og:image" content="assets/img/tribali-1200.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rwt.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* default theme */ }
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="scene" aria-hidden="true">
    <div class="scene-bg" data-parallax="0.18">
      <picture>
        <source type="image/avif" srcset="assets/img/tribali-1200.avif 1200w, assets/img/tribali-1920.avif 1920w" sizes="100vw">
        <source type="image/webp" srcset="assets/img/tribali-1200.webp 1200w, assets/img/tribali-1920.webp 1920w" sizes="100vw">
        <img src="assets/img/tribali-1920.webp" width="1920" height="1080" alt="" fetchpriority="high">
      </picture>
    </div>
    <div class="scene-shade"></div>
    <div class="blob blob-a" data-depth="24"><span class="float"></span></div>
    <div class="blob blob-b" data-depth="-16"><span class="float slow"></span></div>
  </div>

  <header class="topbar">
    <a class="back-link" href="../index.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>All tasks</span>
    </a>
    <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch theme" aria-pressed="true">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="main" class="stage">
    <div class="card" data-reveal>
      <!-- Sign in -->
      <section id="view-login" aria-labelledby="login-title">
        <h1 id="login-title">Sign in</h1>
        <p class="sub">Welcome back. Enter your details to continue.</p>
        <div class="alert" id="login-alert" role="alert" hidden></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" required aria-describedby="email-err">
            <p class="field-error" id="email-err"></p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input class="input has-action" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required minlength="8" aria-describedby="password-err">
              <button type="button" class="input-action" id="toggle-pw" aria-label="Show password" aria-pressed="false">
                <svg class="i-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="i-eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/></svg>
              </button>
            </div>
            <p class="field-error" id="password-err"></p>
          </div>
          <div class="row">
            <label class="check"><input type="checkbox" id="remember" name="remember"> Remember me</label>
            <a href="#forgot" id="to-forgot">Forgot password?</a>
          </div>
          <button class="btn btn-block" type="submit" id="login-btn">Sign in</button>
        </form>
        <p class="demo-hint">Demo account: <code>demo@example.com</code> / <code>Demo@1234</code> <button type="button" class="link-btn" id="fill-demo">Fill it in</button></p>
      </section>

      <!-- Forgot password -->
      <section id="view-forgot" aria-labelledby="forgot-title" hidden>
        <h1 id="forgot-title">Reset password</h1>
        <p class="sub">Enter your email and we will show you what would happen next. This is a demo, no email is sent.</p>
        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="forgot-email">Email</label>
            <input class="input" id="forgot-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="forgot-err">
            <p class="field-error" id="forgot-err"></p>
          </div>
          <button class="btn btn-block" type="submit">Send reset link</button>
          <p class="center"><a href="#login" id="to-login">Back to sign in</a></p>
        </form>
      </section>

      <!-- Signed in -->
      <section id="view-done" aria-labelledby="done-title" hidden>
        <div class="check-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h1 id="done-title">You are signed in</h1>
        <p class="sub" id="done-text"></p>
        <button class="btn btn-block" type="button" id="logout">Sign out</button>
      </section>
    </div>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/parallax.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
